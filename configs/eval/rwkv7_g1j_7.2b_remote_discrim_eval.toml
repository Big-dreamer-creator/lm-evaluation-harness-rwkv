# RWKV7-g1j-7.2B remote discrim_eval run against the hosted api.rwkv.rs
# service, publishing to the local Scoreboard instance (scoreboard-rwkv).
schema_version = 1
backend = "rwkv7-remote"

model_name = "rwkv7-g1j-7.2b"
base_url = "https://api.rwkv.rs/v1/completions"
tokenizer_name = "/home/creator/.cache/lm-eval-rwkv/rwkv7-g1j-7.2b-20260831-ctx16384"
benchmarks = ["discrim_eval"]
output_dir = "results/rwkv7-g1j-7.2b-remote-discrim-eval"

max_length = 16384
num_concurrent = 32
limit = 700

apply_chat_template = false
fewshot_as_multiturn = false
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true

[publication]
enabled = true
base_url = "http://127.0.0.1:7862"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
model_sha256 = "e3091a579c23ea7ebce9a0ad1ecfbda27082eeecd64d7f0474016e626df8f9c3"

[publication.tasks.discrim_eval]
field = "safety"
