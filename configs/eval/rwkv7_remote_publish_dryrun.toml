# Throwaway smoke config to validate the benchmark-level Scoreboard
# publication path (both a standalone task and a group_aggregate task) after
# fixing evaluation_tracker.save_benchmark_artifacts / scoreboard.py's
# task_config/versions lookups. Not a formal benchmark result, do not reuse.
schema_version = 1
backend = "rwkv7-remote"

model_name = "rwkv7-g1j-1.5b"
base_url = "https://api.rwkv.rs/v1/completions"
tokenizer_name = "/home/creator/.cache/lm-eval-rwkv/rwkv7-g1j-1.5b-20260831-ctx16384"
benchmarks = [
  "race",
  "xquad",
]
output_dir = "results/rwkv7-g1j-1.5b-remote-publish-dryrun"

limit = 2
max_length = 16384
num_concurrent = 5

apply_chat_template = true
fewshot_as_multiturn = true
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true

[publication]
enabled = true
dry_run = true
base_url = "http://127.0.0.1:8811"
model_sha256 = "c43176881caf85fe22ad654ab02e7519260d560f3d20420ab590adb0c823860f"

[publication.tasks.race]
field = "reasoning"
[publication.tasks.xquad]
field = "language"
