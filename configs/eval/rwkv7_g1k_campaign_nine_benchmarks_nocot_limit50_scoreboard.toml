# RWKV7-G1K NoCoT campaign over the nine adapted RWKV benchmark families.
# This reruns the matching CoT limit-50 campaign without an explicit think cue.
# The four served aliases map to the rwkv7-g1k-{size}-20260930-ctx25600
# revisions; the model ladder and benchmark protocol otherwise match the CoT run.
#
# Every benchmark stops after 50 documents. no_think uses deterministic
# decoding. max_length=8192 deliberately caps long-context inputs, as in the
# matching CoT campaign; tasks exceeding the client window are truncated or
# receive a smaller generation budget.
schema_version = 1
backend = "rwkv7-remote"

base_url = "https://vllm.rwkvos.com/v1/completions"
benchmarks = [
  "drop",
  "xquad",
  "babilong",
  "infinitebench_rwkv_production",
  "ruler",
  "cruxeval",
  "inverse_scaling_prize",
  "model_written_evals",
  "humaneval_infilling",
]
max_length = 8192
limit = 50
timeout = 1800
trust_remote_code = true

apply_chat_template = true
fewshot_as_multiturn = true
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "no_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true
fresh = false

[publication]
enabled = true
base_url = "http://127.0.0.1:7862"
cot_mode = "NoCoT"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
rerun_reason = "RWKV7-G1K nine-benchmark NoCoT rerun after poor CoT results (drop/xquad/babilong/infinitebench/ruler/cruxeval/inverse_scaling_prize/model_written_evals/humaneval_infilling), limit 50, ctx 8192, deterministic decoding"

[publication.tasks.drop]
field = "reading_comprehension"

[publication.tasks.xquad]
field = "reading_comprehension"

[publication.tasks.babilong]
field = "reasoning"

[publication.tasks.infinitebench_rwkv_production]
field = "reasoning"

[publication.tasks.ruler]
field = "reasoning"

[publication.tasks.cruxeval]
field = "coding"

[publication.tasks.inverse_scaling_prize]
field = "reasoning"

[publication.tasks.model_written_evals]
field = "reasoning"

[publication.tasks.humaneval_infilling]
field = "coding"

[[models]]
model_name = "rwkv7-g1k-1.5b"
tokenizer_name = "/home/link/weight/rwkv-g1k-tokenizer/1.5b"
max_num_seqs = 50
output_dir = "results/rwkv7-g1k-1.5b-20260930-ctx25600-remote-nine-benchmarks-nocot-limit50-confirmed"

[[models]]
model_name = "rwkv7-g1k-2.9b"
tokenizer_name = "/home/link/weight/rwkv-g1k-tokenizer/2.9b"
max_num_seqs = 50
output_dir = "results/rwkv7-g1k-2.9b-20260930-ctx25600-remote-nine-benchmarks-nocot-limit50-confirmed"

[[models]]
model_name = "rwkv7-g1k-7.2b"
tokenizer_name = "/home/link/weight/rwkv-g1k-tokenizer/7.2b"
max_num_seqs = 50
output_dir = "results/rwkv7-g1k-7.2b-20260930-ctx25600-remote-nine-benchmarks-nocot-limit50-confirmed"

[[models]]
model_name = "rwkv7-g1k-13.3b"
tokenizer_name = "/home/link/weight/rwkv-g1k-tokenizer/13.3b"
max_num_seqs = 50
output_dir = "results/rwkv7-g1k-13.3b-20260930-ctx25600-remote-nine-benchmarks-nocot-limit50-confirmed"
