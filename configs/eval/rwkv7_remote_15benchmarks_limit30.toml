# RWKV7-g1j-1.5B remote run over all 15 currently adapted RWKV benchmark
# families, capped with limit = 30 for a quick verification pass against the
# hosted api.rwkv.rs service, using the same chat-template + fake_think
# wiring as the rwkv7-http campaign (configs/eval/lm_eval.toml) now that
# rwkv7-remote applies it too. Not a formal benchmark result.
schema_version = 1
backend = "rwkv7-remote"

model_name = "rwkv7-g1j-1.5b"
base_url = "https://api.rwkv.rs/v1/completions"
tokenizer_name = "/home/creator/.cache/lm-eval-rwkv/rwkv7-g1j-1.5b-20260831-ctx16384"
# The array order is the campaign execution order. These are native
# lm-eval-harness task/group/tag names, resolved directly by TaskManager.
benchmarks = [
  "race",
  "drop",
  "xquad",
  "babilong",
  "infinitebench",
  "ruler",
  "wmdp",
  "cruxeval",
  "inverse_scaling_prize",
  "model_written_evals",
  "humaneval_infilling",
  "mutual",
  "mc_taco",
  "discrim_eval",
  "winogender",
]
output_dir = "results/rwkv7-g1j-1.5b-remote-15benchmarks-limit30"

limit = 30
max_length = 16384
num_concurrent = 5

apply_chat_template = true
fewshot_as_multiturn = true
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"

# Crash-safe resume: run with `--resume` to durably checkpoint each item's
# result under output_dir/checkpoints/run.sqlite3. Re-running the same
# command after a crash/kill skips already-completed benchmarks/items
# instead of redispatching them. See RWKV_EVALUATION_GUIDE.md section 10.4.
[checkpoint]
enabled = true

# Publish each benchmark's aggregated result once all its leaves are done.
# Token is read from the SCOREBOARD_PUBLICATION_TOKEN env var, never written
# here.
[publication]
enabled = true
base_url = "http://127.0.0.1:8811"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
model_sha256 = "c43176881caf85fe22ad654ab02e7519260d560f3d20420ab590adb0c823860f"

[publication.tasks.race]
field = "reasoning"
[publication.tasks.drop]
field = "reasoning"
[publication.tasks.xquad]
field = "language"
[publication.tasks.babilong]
field = "long_context"
[publication.tasks.infinitebench]
field = "long_context"
[publication.tasks.ruler]
field = "long_context"
[publication.tasks.wmdp]
field = "knowledge"
[publication.tasks.cruxeval]
field = "code"
[publication.tasks.inverse_scaling_prize]
field = "reasoning"
[publication.tasks.model_written_evals]
field = "safety"
[publication.tasks.humaneval_infilling]
field = "code"
[publication.tasks.mutual]
field = "reasoning"
[publication.tasks.mc_taco]
field = "reasoning"
[publication.tasks.discrim_eval]
field = "safety"
[publication.tasks.winogender]
field = "safety"
