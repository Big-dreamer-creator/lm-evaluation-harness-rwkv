# RWKV7-g1j-1.5B remote-chat run over 5 benchmark families, capped with
# --limit 50, for score comparison against the equivalent rwkv7-remote
# (/v1/completions) campaign. Uses the new "rwkv7-remote-chat" backend:
# server-side chat-template rendering via /v1/chat/completions, no local
# tokenizer required. Not a formal benchmark result.
schema_version = 1
backend = "rwkv7-remote-chat"

model_name = "rwkv7-g1j-1.5b"
base_url = "https://api.rwkv.rs/v1/chat/completions"
benchmarks = [
  "race",
  "drop",
  "xquad",
  "babilong",
  "wmdp",
]
output_dir = "results/rwkv7-g1j-1.5b-remote-chat-5benchmarks-limit50"

limit = 50
max_length = 16384
num_concurrent = 5

apply_chat_template = false
fewshot_as_multiturn = false
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true

[publication]
enabled = true
base_url = "http://127.0.0.1:8811"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
model_sha256 = "c43176881caf85fe22ad654ab02e7519260d560f3d20420ab590adb0c823860f"

[publication.tasks.race]
field = "reasoning"

[publication.tasks.drop]
field = "reasoning"

[publication.tasks.xquad]
field = "reasoning"

[publication.tasks.babilong]
field = "reasoning"

[publication.tasks.wmdp]
field = "knowledge"
