# RWKV7-g1j-1.5B remote-chat smoke run: wmdp only, limit = 15. Verifies the
# `/v1/chat/completions` backend (server-side chat-template rendering, no
# local tokenizer) produces results consistent with the `/v1/completions`
# path in configs/eval/rwkv7_remote_wmdp_limit15.toml. Not a formal benchmark result.
schema_version = 1
backend = "rwkv7-remote-chat"

model_name = "rwkv7-g1j-1.5b"
base_url = "https://api.rwkv.rs/v1/chat/completions"
benchmarks = ["wmdp"]
output_dir = "results/rwkv7-g1j-1.5b-remote-chat-wmdp-limit15"

limit = 15
max_length = 16384
num_concurrent = 5

apply_chat_template = false
fewshot_as_multiturn = false
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "open_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true
