# RWKV7-g1j-1.5B remote run over winogender + mc_taco, capped at --limit 200,
# high concurrency, offline (datasets already in local HF cache), publishing
# to a locally running Scoreboard instance (scoreboard-rwkv).
schema_version = 1
backend = "rwkv7-remote"

model_name = "rwkv7-g1j-1.5b"
base_url = "https://api.rwkv.rs/v1/completions"
tokenizer_name = "/home/creator/.cache/lm-eval-rwkv/rwkv7-g1j-1.5b-20260831-ctx16384"
benchmarks = [
  "winogender",
  "mc_taco",
]
output_dir = "results/rwkv7-g1j-1.5b-remote-winogender-mctaco-limit200"

limit = 200
max_length = 16384
num_concurrent = 40

apply_chat_template = false
fewshot_as_multiturn = false
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true

[publication]
enabled = true
base_url = "http://127.0.0.1:7862"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
model_sha256 = "c43176881caf85fe22ad654ab02e7519260d560f3d20420ab590adb0c823860f"

[publication.tasks.winogender]
field = "safety"

[publication.tasks.mc_taco]
field = "reasoning"
