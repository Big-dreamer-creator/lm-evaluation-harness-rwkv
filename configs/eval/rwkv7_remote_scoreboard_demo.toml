# RWKV7-g1j-1.5B remote smoke run used to demo publication to a local
# Scoreboard instance. Not a formal benchmark config -- run with --limit.
schema_version = 1
backend = "rwkv7-remote"

model_name = "rwkv7-g1j-1.5b"
base_url = "https://api.rwkv.rs/v1/completions"
tokenizer_name = "/home/creator/.cache/lm-eval-rwkv/rwkv7-g1j-1.5b-20260831-ctx16384"
benchmarks = [
  "race",
  "drop",
  "winogender_all",
  "inverse_scaling_neqa",
  "wmdp",
]
output_dir = "results/rwkv7-g1j-1.5b-remote-scoreboard-demo"

max_length = 16384
num_concurrent = 5

apply_chat_template = false
fewshot_as_multiturn = false
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"

# Crash-safe resume: run with `--resume` (or set enabled = true here) to
# durably checkpoint each item's result under output_dir/checkpoints/run.sqlite3.
# Re-running the same command after a crash/kill skips already-completed
# benchmarks/items instead of redispatching them, and retries publication
# alone if it didn't succeed before the crash. See RWKV_EVALUATION_GUIDE.md.
[checkpoint]
enabled = false
# dir = "results/rwkv7-g1j-1.5b-remote-scoreboard-demo/checkpoints"
# fresh = false

[publication]
enabled = true
base_url = "http://127.0.0.1:8811"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
model_sha256 = "c43176881caf85fe22ad654ab02e7519260d560f3d20420ab590adb0c823860f"

[publication.tasks.race]
field = "reasoning"

[publication.tasks.drop]
field = "reasoning"

[publication.tasks.winogender_all]
field = "reasoning"

[publication.tasks.inverse_scaling_neqa]
field = "reasoning"

[publication.tasks.wmdp_bio]
field = "knowledge"

[publication.tasks.wmdp_chem]
field = "knowledge"

[publication.tasks.wmdp_cyber]
field = "knowledge"
