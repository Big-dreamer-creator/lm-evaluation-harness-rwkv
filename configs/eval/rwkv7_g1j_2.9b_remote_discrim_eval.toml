# RWKV7-g1j-2.9B remote discrim_eval run against the hosted api.rwkv.rs
# service, publishing to the local Scoreboard instance (scoreboard-rwkv).
# tokenizer_name reuses the g1j-1.5b cache dir: all rwkv7-g1j sizes share
# the same rwkv_vocab_v20230424 tokenizer (verified byte-identical against
# the 7.2b cache), and only the tokenizer files are read here.
schema_version = 1
backend = "rwkv7-remote"

model_name = "rwkv7-g1j-2.9b"
base_url = "https://api.rwkv.rs/v1/completions"
tokenizer_name = "/home/creator/.cache/lm-eval-rwkv/rwkv7-g1j-1.5b-20260831-ctx16384"
benchmarks = ["discrim_eval"]
output_dir = "results/rwkv7-g1j-2.9b-remote-discrim-eval"

max_length = 16384
num_concurrent = 48
limit = 700

apply_chat_template = false
fewshot_as_multiturn = false
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true

[publication]
enabled = true
base_url = "http://127.0.0.1:7862"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
model_sha256 = "966f3420f833532aae3fb1fd6326533b08d43d23b7b03eaa2f0694a30b64a239"

[publication.tasks.discrim_eval]
field = "safety"
