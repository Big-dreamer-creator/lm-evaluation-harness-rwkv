# RWKV7-g1j-13.3B remote discrim_eval run against the hosted api.rwkv.rs
# service, publishing to the local Scoreboard instance (scoreboard-rwkv).
# tokenizer_name reuses the g1j-1.5b cache dir: see the 2.9b config for why
# that's safe (shared tokenizer across all rwkv7-g1j sizes).
schema_version = 1
backend = "rwkv7-remote"

model_name = "rwkv7-g1j-13.3b"
base_url = "https://api.rwkv.rs/v1/completions"
tokenizer_name = "/home/creator/.cache/lm-eval-rwkv/rwkv7-g1j-1.5b-20260831-ctx16384"
benchmarks = ["discrim_eval"]
output_dir = "results/rwkv7-g1j-13.3b-remote-discrim-eval"

max_length = 16384
num_concurrent = 16
limit = 700

apply_chat_template = false
fewshot_as_multiturn = false
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true

[publication]
enabled = true
base_url = "http://127.0.0.1:7862"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
model_sha256 = "559371f5b9aef13189ae54b345ac096af4ad2b689996c05d89de687612b3ae65"

[publication.tasks.discrim_eval]
field = "safety"
