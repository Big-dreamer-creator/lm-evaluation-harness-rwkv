# Real-traffic regression check for the multi-replica pool / capacity-aware
# load balancing / adaptive context-length retry / cross-benchmark
# shortest-remaining-rollout scheduler work. Single real endpoint (no
# pool_manifest, so this exercises the single-replica fallback path plus the
# new [scheduler] concurrent-benchmark admission logic and checkpoint/resume).
# Not a formal benchmark result.
schema_version = 1
backend = "rwkv7-remote-chat"

model_name = "rwkv7-g1j-7.2b"
base_url = "https://api.rwkv.rs/v1/chat/completions"
benchmarks = [
  "race",
  "drop",
  "xquad",
  "babilong",
  "wmdp",
]
output_dir = "results/rwkv7-g1j-7.2b-remote-chat-5benchmarks-limit50"

limit = 50
max_length = 16384
num_concurrent = 20

apply_chat_template = false
fewshot_as_multiturn = false
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true

[scheduler]
max_concurrent_benchmarks = 3
