# RWKV7-g1j-7.2B remote run: race only, open_think generation mode, limit = 90,
# published to the local Scoreboard. Not a formal benchmark result.
schema_version = 1
backend = "rwkv7-remote"

model_name = "rwkv7-g1j-7.2b"
base_url = "https://api.rwkv.rs/v1/completions"
tokenizer_name = "/home/creator/.cache/lm-eval-rwkv/rwkv7-g1j-7.2b-20260831-ctx16384"
benchmarks = ["race"]
output_dir = "results/rwkv7-g1j-7.2b-remote-race-openthink-limit90"

limit = 90
max_length = 16384
num_concurrent = 5

apply_chat_template = true
fewshot_as_multiturn = true
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "open_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true

# Publish once race completes. Token is read from SCOREBOARD_PUBLICATION_TOKEN
# env var, never written here.
[publication]
enabled = true
base_url = "http://127.0.0.1:8811"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
model_sha256 = "e3091a579c23ea7ebce9a0ad1ecfbda27082eeecd64d7f0474016e626df8f9c3"

[publication.tasks.race]
field = "reasoning"
