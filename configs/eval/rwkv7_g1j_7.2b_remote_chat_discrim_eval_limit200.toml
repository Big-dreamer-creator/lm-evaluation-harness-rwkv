# RWKV7-g1j-7.2B remote-chat discrim_eval run against the hosted api.rwkv.rs
# service, generative scoring via /v1/chat/completions (avg@k), publishing
# to the local Scoreboard instance (scoreboard-rwkv).
schema_version = 1
backend = "rwkv7-remote-chat"

model_name = "rwkv7-g1j-7.2b"
base_url = "https://api.rwkv.rs/v1/chat/completions"
benchmarks = ["discrim_eval"]
output_dir = "results/rwkv7-g1j-7.2b-remote-chat-discrim-eval-limit200"

max_length = 16384
num_concurrent = 48
limit = 200

apply_chat_template = false
fewshot_as_multiturn = false
log_samples = true

[rwkv_profile]
prompt_template = "assistant"
generation_prompt = "fake_think"
wkv_mode = "fp32io16"

[checkpoint]
enabled = true

[publication]
enabled = true
base_url = "http://127.0.0.1:7862"
cot_mode = "FakeCoT"
token_env = "SCOREBOARD_PUBLICATION_TOKEN"
model_sha256 = "e3091a579c23ea7ebce9a0ad1ecfbda27082eeecd64d7f0474016e626df8f9c3"

[publication.tasks.discrim_eval]
field = "reasoning"
avg_k = 1
