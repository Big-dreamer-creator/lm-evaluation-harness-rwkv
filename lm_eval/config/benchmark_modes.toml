# RWKV evaluation modes. Prototype: config/benchmarks.toml.
# Native TaskManager expands groups/tags. Exact leaf entries override their
# enclosing selectors, with the nearest enclosing selector taking precedence.
# Unlisted tasks use default.
# NoCoT multiple choice uses loglikelihood; NoCoT open answers use generate_until.
default = "no_think"

[no_think]
benchmarks = [
  "wmdp", "arab_culture", "bertaqa_eu", "bertaqa_en", "click",
  "eus_trivia", "haerae", "kmmlu", "kmmlu_hard", "tmlu", "tmmluplus",
  "careqa_en", "careqa_es", "med_concepts_qa", "kbl_bar_exam_em",
  "kbl_knowledge_em", "kbl_reasoning_em", "kormedmcqa", "mediqa_qa2019",
  "olaph", "nrk_quiz_qa", "babilong", "discrim_eval",
  "infinitebench_rwkv_production", "inverse_scaling_prize", "mc_taco",
  "model_written_evals", "mutual", "ruler", "winogender", "mutual_plus",
  "drop", "race", "xquad", "eus_reading", "naijarc_tasks", "norquad",
  "aclue_reading_comprehension", "logiqa2", "infinitebench_longbook_qa_en",
  "infinitebench_longbook_qa_chn", "infinitebench_longdialogue_qa_en",
  "infinitebench_longbook_choice_en", "humaneval_infilling",
  "cruxeval_input", "cruxeval_input_08", "cruxeval_output", "cruxeval_output_08",
]

[fake_think]
benchmarks = []

[open_think]
# CRUXEval exposes direct-answer and CoT variants: the tag "cruxeval" is mixed.
# Explicit CoT variants retain their native prompts, repeats and token budgets.
benchmarks = ["cruxeval_input_cot", "cruxeval_output_cot", "rwkv_coding_local"]
