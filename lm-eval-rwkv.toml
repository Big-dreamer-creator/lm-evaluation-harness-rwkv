# Complete RWKV7 evaluation entrypoint. Benchmark protocol lives in task YAML.
model = "rwkv7-http"
tasks = ["rwkv7_g1i_1_5b_20260805_ctx16384"]
batch_size = 1
device = "cpu"
apply_chat_template = true
fewshot_as_multiturn = true
log_samples = true
output_path = "results/rwkv7-g1i-1.5b-20260805-ctx16384"
seed = [0, 1234, 1234, 1234]

[model_args]
model = "rwkv7-g1i-1.5b-20260805-ctx16384"
base_url = "http://127.0.0.1:8000/v1/completions"
rwkv_prompt_template = "assistant"
rwkv_generation_prompt = "fake_think"
num_concurrent = 5
max_length = 16384

[metadata]
model_name = "rwkv7-g1i-1.5b-20260805-ctx16384"
wkv_mode = "fp32io16"
cot_mode = "fake_think"
prompt_template = "assistant"
